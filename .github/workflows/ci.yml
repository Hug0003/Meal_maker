name: CI

# Meal Maker : deux images (web + api) construites et testées à chaque push.
#   1. checks : lint, format, types, tests unitaires et d'intégration (Postgres + Redis réels) ;
#   2. build : construction des images, test de fumée de la pile docker compose lancée comme en
#      production (sans fichier override), parcours Playwright de bout en bout ;
#   3. publication sur ghcr.io/hug0003/meal-maker-{api,web} (:latest et :<sha>) hors pull requests.
# Pas encore de déploiement automatique : voir « Déploiement » dans le README pour le brancher sur sites-infra.
#
# Runner : comme le portfolio, variable de dépôt RUNS_ON (ex. self-hosted) sinon ubuntu-latest.
# Prévu pour un runner auto-hébergé partagé : aucun port hôte fixe, noms/tags propres au run, rien ne
# reste après le run, et seuls Docker, git et curl sont supposés présents sur le serveur.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_API: ghcr.io/hug0003/meal-maker-api
  IMAGE_WEB: ghcr.io/hug0003/meal-maker-web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meal
          POSTGRES_PASSWORD: meal
          POSTGRES_DB: meal_test
        # Port hôte aléatoire : pas de conflit avec un Postgres/Redis déjà présent sur le serveur.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U meal" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Service URLs
        run: |
          PG="postgresql://meal:meal@127.0.0.1:${{ job.services.postgres.ports['5432'] }}"
          {
            echo "PG_BASE=$PG"
            echo "TEST_DATABASE_URL=$PG/meal_test"
            echo "DATABASE_URL=$PG/meal_test"
            echo "REDIS_URL=redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      # Le schéma Prisma et les migrations doivent rester alignés.
      - name: Migrations up to date
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U meal -d meal_test -c 'CREATE DATABASE meal_shadow'
          npx prisma migrate diff \
            --from-migrations apps/api/prisma/migrations \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --shadow-database-url "$PG_BASE/meal_shadow" \
            --exit-code \
            || { echo "::error::Le schéma Prisma a changé sans migration (npx prisma migrate dev)."; exit 1; }

  build:
    needs: checks
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_API }}:ci-${{ github.run_id }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_WEB }}:ci-${{ github.run_id }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Lance la pile complète comme en production et vérifie chaque point d'entrée.
      - name: Smoke test
        env:
          API_IMAGE: ${{ env.IMAGE_API }}:ci-${{ github.run_id }}
          WEB_IMAGE: ${{ env.IMAGE_WEB }}:ci-${{ github.run_id }}
          # Port hôte aléatoire sur 127.0.0.1 : aucun conflit possible sur un runner auto-hébergé partagé.
          WEB_PORT: '127.0.0.1:'
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          COOKIE_SECRET: ci-secret-${{ github.run_id }}-0123456789
        run: |
          PROJECT="mm-smoke-$GITHUB_RUN_ID"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          docker compose -p "$PROJECT" -f docker-compose.yml up -d --pull never --wait --wait-timeout 180 \
            || { docker compose -p "$PROJECT" -f docker-compose.yml logs; exit 1; }
          BASE="http://$(docker compose -p "$PROJECT" -f docker-compose.yml port web 8080)"
          echo "BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Pile de test : $BASE"

          fail=0
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$1")
            if [ "$code" = "$2" ]; then echo "OK    $code $1"; else echo "ÉCHEC $code $1 (attendu $2)"; fail=1; fi
          }
          check / 200
          check /healthz 200
          check /api/health 200
          check /api/meta 200
          check /api/recipes/random 200
          check /recette/1 200
          check /frigo 200
          check /manifest.webmanifest 200
          check /api/inconnu 404
          check /assets/inexistant.js 404
          # Fichiers qui ne doivent jamais être servis
          check /.env 404
          check /.git/config 404
          check /index.html.map 404

          total=$(curl -s "$BASE/api/recipes?pageSize=1" | grep -o '"total":[0-9]*' | cut -d: -f2)
          if [ "${total:-0}" -gt 150 ]; then echo "OK    $total recettes"; else echo "ÉCHEC seulement $total recettes"; fail=1; fi

          echo "--- En-têtes"
          for p in / /recette/1 /api/health; do
            curl -sI "$BASE$p" | grep -qi '^x-content-type-options: nosniff' \
              && echo "OK    nosniff $p" || { echo "ÉCHEC nosniff absent $p"; fail=1; }
          done
          for p in / /recette/1; do
            curl -sI "$BASE$p" | grep -qi "^content-security-policy: default-src 'self'" \
              && echo "OK    CSP $p" || { echo "ÉCHEC CSP absente $p"; fail=1; }
          done

          if [ "$fail" != 0 ]; then docker compose -p "$PROJECT" -f docker-compose.yml logs; exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Navigateurs fournis par l'image officielle Playwright (même version que le lockfile) :
      # rien à installer sur le serveur (pas de sudo / apt). Réseau hôte pour joindre 127.0.0.1:<port>.
      - name: End-to-end tests (Playwright)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --network host --ipc host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true -e BASE_URL="$BASE_URL" \
            -v "$PWD:/work" -w /work/apps/web \
            "mcr.microsoft.com/playwright:v$PW_VERSION-noble" \
            npx playwright test --project desktop --project mobile

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Clean up smoke test
        if: always()
        run: |
          [ -n "$PROJECT" ] && docker compose -p "$PROJECT" -f docker-compose.yml down -v --remove-orphans > /dev/null 2>&1 || true
          docker image rm "$IMAGE_API:ci-$GITHUB_RUN_ID" "$IMAGE_WEB:ci-$GITHUB_RUN_ID" > /dev/null 2>&1 || true

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api

      - name: Push web image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web

  # Déploiement sur 192.168.11.134 : le runner tourne sur ce serveur, donc pas de VPN ni de SSH.
  # Tout est dans /opt/meal-maker (docker-compose.yml + .env) ; les données sont dans le volume Docker
  # meal-maker_meal-pg. Le .env est généré une seule fois (mots de passe aléatoires) puis conservé.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-meal-maker
      cancel-in-progress: false
    env:
      DEPLOY_PATH: /opt/meal-maker
      # N'écoute que sur l'adresse du serveur dans le réseau local ; l'Apache de Main relaie le domaine.
      HOST_IP: ${{ vars.DEPLOY_HOST_IP || '192.168.11.134' }}
      HOST_PORT: ${{ vars.DEPLOY_PORT || '8102' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare /opt/meal-maker
        run: |
          # /opt appartient à root : le dossier est créé via Docker (l'utilisateur du runner est dans le groupe docker).
          docker run --rm -v /opt:/opt alpine:3.20 sh -c \
            "mkdir -p $DEPLOY_PATH && chown $(id -u):$(id -g) $DEPLOY_PATH && chmod 750 $DEPLOY_PATH"
          cp docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"
          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "Premier déploiement : génération du .env"
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(tr -dc a-f0-9 < /dev/urandom | head -c 48)"
              echo "COOKIE_SECRET=$(tr -dc a-f0-9 < /dev/urandom | head -c 64)"
              echo "IMPORT_MEALDB=true"
              echo "APP_PASSWORD="
            } > "$DEPLOY_PATH/.env"
          fi
          # Valeurs gérées par le workflow : port d'écoute et images de ce commit.
          sed -i '/^WEB_PORT=/d;/^API_IMAGE=/d;/^WEB_IMAGE=/d' "$DEPLOY_PATH/.env"
          {
            echo "WEB_PORT=$HOST_IP:$HOST_PORT"
            echo "API_IMAGE=ghcr.io/hug0003/meal-maker-api:$GITHUB_SHA"
            echo "WEB_IMAGE=ghcr.io/hug0003/meal-maker-web:$GITHUB_SHA"
          } >> "$DEPLOY_PATH/.env"
          # Le mot de passe du site (facultatif) vient d'un secret s'il est défini.
          if [ -n "$APP_PASSWORD" ]; then
            sed -i '/^APP_PASSWORD=/d' "$DEPLOY_PATH/.env"
            echo "APP_PASSWORD=$APP_PASSWORD" >> "$DEPLOY_PATH/.env"
          fi
        env:
          APP_PASSWORD: ${{ secrets.MEAL_APP_PASSWORD }}

      - name: Pull and restart
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Connexion GHCR le temps du pull seulement : aucun jeton ne reste sur le serveur.
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin > /dev/null
          docker compose -p meal-maker pull -q
          docker compose -p meal-maker up -d --remove-orphans --wait --wait-timeout 300 \
            || { docker compose -p meal-maker logs --tail 80; exit 1; }
          docker image prune -f > /dev/null
          docker compose -p meal-maker ps --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'

      - name: Health check
        run: |
          fail=0
          for p in / /api/health /api/meta /recette/1; do
            c=$(curl -s -o /dev/null -m 10 -w "%{http_code}" -H "Host: mealmaker.hugomeuriel.fr" -H "X-Forwarded-Proto: https" "http://$HOST_IP:$HOST_PORT$p")
            echo "$c $p"
            [ "$c" = 200 ] || fail=1
          done
          if [ "$fail" != 0 ]; then docker compose -p meal-maker -f "$DEPLOY_PATH/docker-compose.yml" logs --tail 80; fi
          exit $fail
